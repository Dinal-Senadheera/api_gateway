apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deploy
  namespace: ctse-microservices
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: app
          image: dinalsenadheera/ctse-assignment-gateway:latest
          ports:
            - containerPort: 3002
          env:
            - name: COURSE_SERVICE_ENDPOINT
              value: "http://course-management-svc"
            - name: AUTH_SERVICE_ENDPOINT
              value: "http://auth-service"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: ctse-microservices
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0eaeb6f6b5a66f652"
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3002